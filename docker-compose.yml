services:
  # ── MongoDB Service for ClimCam Telemetry Storage ───────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: climcam-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${DATABASE_NAME:-climcam_db}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-climcam_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-climcam_pass}
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
