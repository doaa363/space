version: '3.8'

services:
  # ── MongoDB Service for ClimCam Telemetry Storage ───────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: climcam-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: climcam_db
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
    driver: local
